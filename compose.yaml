services:
  server:
    build:
      context: .
    container_name: VideoStream-App
    image: videostream-app:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - s-network
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - hsl:/app/videos_hsl
    env_file:
      - .env
    profiles: ["dev"]

  mysql:
    image: mysql:latest
    container_name: VideoStream-MySQL
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: VideoStream
      MYSQL_USER: VideoStream-MySQL
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    networks:
      - s-network
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  uploads:
  hsl:

networks:
  s-network:
    driver: bridge
