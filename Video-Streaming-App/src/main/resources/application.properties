spring.application.name=Video-Streaming-App

# Set active profile
spring.profiles.active=dev

jwt.secret=${JWT_SECRET_KEY}
security.jwt.issuer=${JWT_ISSUER:Video-Streaming-App}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:1209600}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

spring.security.oauth2.client.registration.google.client-id=${oauth2_client-id}
spring.security.oauth2.client.registration.google.client-secret=${oauth2_client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/google
spring.security.oauth2.client.registration.google.scope=email,profile,openid

spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.from=SnapBuy <rg2822046@gmail.com>
spring.mail.port=587
spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5173
app.auth.success-redirect=http://localhost:5173/auth/success
app.auth.failure-redirect=http://localhost:5173/auth/failure
ott.token.expiry.seconds=300

# Logging configuration (common across all profiles)
spring.output.ansi.enabled=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){yellow} %clr([%15.15t]){cyan} %clr(%-40.40logger{39}){blue} : %m%n