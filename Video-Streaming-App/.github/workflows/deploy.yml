deploy:
  needs: build
  runs-on: ubuntu-latest
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Copy compose.yaml to server (No git pull needed!)
    - name: Copy docker-compose to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DIGITALOCEAN_HOST }}
        username: ${{ secrets.DIGITALOCEAN_USERNAME }}
        key: ${{ secrets.DIGITALOCEAN_PRIVATE_KEY }}
        source: "compose.yaml" # Make sure this file exists in your repo!
        target: "/root/video-streaming-app"

    # 2. SSH, Create .env, and Deploy
    - name: Deploy to DigitalOcean via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DIGITALOCEAN_HOST }}
        username: ${{ secrets.DIGITALOCEAN_USERNAME }}
        key: ${{ secrets.DIGITALOCEAN_PRIVATE_KEY }}
        script: |
          # Create directory if missing
          mkdir -p ~/video-streaming-app
          cd ~/video-streaming-app
          
          # ─── AUTO-GENERATE .ENV FILE ───
          # This ensures your secrets are always up to date
          echo "SPRING_PROFILES_ACTIVE=prod" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }}" >> .env
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> .env
          echo "R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}" >> .env
          echo "R2_BUCKET=${{ secrets.R2_BUCKET }}" >> .env
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          
          # Login to Docker Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull latest image
          docker pull ghcr.io/${{ github.repository }}:main
          
          # Stop old container
          docker compose down || true
          
          # Start up (Docker Compose reads the .env file we just created)
          docker compose up -d
          
          # Cleanup old images to save disk space
          docker image prune -f
          
          echo "Deployment successful!"

on:
jobs: